name: Telegram Bot Runner

on:
  # يشتغل تلقائيًا كل 5 ساعات (قبل ما الجوب القديم يوصل لحد الـ 6 ساعات)
  schedule:
    - cron: "0 */5 * * *"
  # يسمحلك تشغّله يدوي من تبويب Actions لو عايز تبدأه فورًا
  workflow_dispatch:

# ده أهم جزء: لو جوب جديد بدأ، يقفل القديم فورًا
# عشان يفضل نسخة واحدة بس شغالة (تجنبًا لتعارض الـ polling)
concurrency:
  group: telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # أقل من حد الـ 6 ساعات (360 دقيقة) عشان يدّي وقت كافي قبل التبديل
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: python bot.py
