name: Telegram Bot Runner

on:
  # يشتغل تلقائيًا كل 5 ساعات
  schedule:
    - cron: "0 */5 * * *"
  # تشغيل يدوي عند الحاجة
  workflow_dispatch:

# قفل الجوب القديم فورًا عند بدء جديد لمنع تعارض الـ polling
concurrency:
  group: telegram-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # تحميل وتثبيت FFmpeg Static Binary مباشرة في ثوانٍ بدون الاعتماد على أي Action خارجي
      - name: Install ffmpeg
        run: |
          mkdir -p ffmpeg_temp
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz | tar -xJ -C ffmpeg_temp --strip-components=1
          sudo mv ffmpeg_temp/ffmpeg ffmpeg_temp/ffprobe /usr/local/bin/
          rm -rf ffmpeg_temp
          ffmpeg -version

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for auto-commit
        run: |
          git config user.name "telegram-bot"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run the bot
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py
