name: Telegram Bot Runner

on:
  # يشتغل تلقائيًا كل 5 ساعات
  schedule:
    - cron: "0 */5 * * *"
  # تشغيل يدوي عند الحاجة
  workflow_dispatch:

# قفل الجوب القديم فورًا عند بدء جديد لمنع تعارض الـ polling
concurrency:
  group: telegram-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # تثبيت سرييع ومضمون لـ FFmpeg بدون الاعتماد على مستودعات خارجية غير مستقرة
      - name: Install ffmpeg
        uses: yt-dlp/setup-ffmpeg@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git for auto-commit
        run: |
          git config user.name "telegram-bot"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Run the bot
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
        run: python bot.py
